<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Windows 95 Desktop Teal Background Circle/Square -->
  <rect width="64" height="64" rx="14" fill="#008080"/>
  
  <!-- Windows 95 Outer Bevel Body -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#C0C0C0" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M55 9 L55 55 L9 55" stroke="#808080" stroke-width="2" fill="none"/>
  <path d="M56 8 L56 56 L8 56" stroke="#000000" stroke-width="1" fill="none"/>

  <!-- Calculator Screen (Sunken Navy LCD Display) -->
  <rect x="14" y="14" width="36" height="13" fill="#000080"/>
  <rect x="15" y="15" width="34" height="11" fill="#040926"/>
  
  <!-- Screen Text (Retro Lime Green LCD Font) -->
  <text x="46" y="24" font-family="monospace" font-weight="bold" font-size="9" fill="#00FF66" text-anchor="end">95.00</text>

  <!-- Keypad Buttons - Row 1 -->
  <rect x="14" y="30" width="8" height="7" fill="#DFDFDF"/>
  <path d="M14 30 L22 30 L22 37 L14 37 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M22 30 L22 37 L14 37" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="18" y="35.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">7</text>

  <rect x="24" y="30" width="8" height="7" fill="#DFDFDF"/>
  <path d="M24 30 L32 30 L32 37 L24 37 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M32 30 L32 37 L24 37" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="28" y="35.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">8</text>

  <rect x="34" y="30" width="8" height="7" fill="#DFDFDF"/>
  <path d="M34 30 L42 30 L42 37 L34 37 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M42 30 L42 37 L34 37" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="38" y="35.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">9</text>

  <rect x="44" y="30" width="6" height="7" fill="#D4D0C8"/>
  <path d="M44 30 L50 30 L50 37 L44 37 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M50 30 L50 37 L44 37" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="47" y="35.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#800000" text-anchor="middle">÷</text>

  <!-- Keypad Buttons - Row 2 -->
  <rect x="14" y="39" width="8" height="7" fill="#DFDFDF"/>
  <path d="M14 39 L22 39 L22 46 L14 46 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M22 39 L22 46 L14 46" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="18" y="44.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">4</text>

  <rect x="24" y="39" width="8" height="7" fill="#DFDFDF"/>
  <path d="M24 39 L32 39 L32 46 L24 46 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M32 39 L32 46 L24 46" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="28" y="44.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">5</text>

  <rect x="34" y="39" width="8" height="7" fill="#DFDFDF"/>
  <path d="M34 39 L42 39 L42 46 L34 46 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M42 39 L42 46 L34 46" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="38" y="44.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">6</text>

  <rect x="44" y="39" width="6" height="7" fill="#D4D0C8"/>
  <path d="M44 39 L50 39 L50 46 L44 46 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M50 39 L50 46 L44 46" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="47" y="44.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#800000" text-anchor="middle">×</text>

  <!-- Keypad Buttons - Row 3 -->
  <rect x="14" y="48" width="18" height="7" fill="#DFDFDF"/>
  <path d="M14 48 L32 48 L32 55 L14 55 Z" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M32 48 L32 55 L14 55" stroke="#707070" stroke-width="1" fill="none"/>
  <text x="23" y="53.5" font-family="sans-serif" font-weight="bold" font-size="5" fill="#000" text-anchor="middle">C</text>

  <rect x="34" y="48" width="16" height="7" fill="#000080"/>
  <path d="M34 48 L50 48 L50 55 L34 55 Z" fill="none" stroke="#3A6EA5" stroke-width="1"/>
  <path d="M50 48 L50 55 L34 55" stroke="#000033" stroke-width="1" fill="none"/>
  <text x="42" y="53.8" font-family="sans-serif" font-weight="bold" font-size="6" fill="#FFFF00" text-anchor="middle">=</text>
</svg>
